<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
  </head>
  <body>
    <header
      class="bg-amber-200 w-full h-20 flex items-center sticky top-0 z-50"
    >
      <img class="w-14 ml-4" src="images/artisan.png" alt="Logo" />
      <h1 class="ml-4 font-bold text-3xl">Taawon</h1>
      <nav
        class="gap-6 ml-auto mr-15 flex flex-wrap justify-center items-center gap-x-4 gap-y-2 sm:ml-auto"
      >
        <a href="index.html">Accueill</a>
        <a href="cooperatives.html">Coopératives</a>
        <a href="a-propos.html">A propos</a>
        <button
          type="button"
          class="cursor-pointer text-white border-black bg-black rounded-full border-4 px-4"
        >
          dark
        </button>
      </nav>
    </header>
    <main>
      <section
        class="grid grid-col-1 md:grid-cols-2 gap-10 max-w-6xl mx-auto px-4 py-12"
        aria-label="insctiption et questions fréquentes"
      >
        <div class="bg-white rounded-xl p-6">
          <h2 class="text-2xl font-bold font-serif mb-5 text-center">
            Inscription
          </h2>
          <form action="#" method="post" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1">
              <label for="nom" class="font-semibold mb-3"
                >Nom de la coopérative *</label
              >
              <input
                type="text"
                id="nom"
                name="nom"
                required
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label for="region" class="font-semibold mb-3"
                >Région / ville *</label
              >
              <input
                type="text"
                id="region"
                name="region"
                required
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label for="Métier" class="font-semibold mb-3">Métier *</label>
              <input
                type="text"
                name="Métier"
                id="Métier"
                required
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label for="Nombre de membres" class="font-semibold mb-3"
                >Nombre de membres</label
              >
              <input
                type="text"
                id="Nombre de membres"
                name="Nombre de membres"
                required
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>
            <div class="flex flex-col gap-1">
              <label for="Description de l'activité" class="font-semibold mb-3"
                >Description de l'activité *</label
              >
              <textarea
                name="Description de l'activité"
                id="Description de l'activité"
                rows="4"
                placeholder="Votre Message..."
                class="border border-stone-900 rounded-lg px-3 py-2 focus:outline-2 focus:outline-orange-600"
              ></textarea>
            </div>
            <div class="flex flex-col">
              <label
                for="Lien photos / réseaux sociaux"
                class="font-semibold mb-3"
                >Lien photos / réseaux sociaux *</label
              >
              <input
                type="text"
                id="Lien photos / réseaux sociaux"
                name="Lien photos / réseaux sociaux"
                required
                placeholder="Facebook/instageram/youtoub..."
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>
            <h3 class="font-bold text-center w-max mx-auto border-b ">Personne de contact</h3>
            <div class="flex flex-col">
              <label for="email" class="font-semibold mb-3">Nome Complet*</label>
              <input
                type="text"
                id="email"
                name="email"
                required
                placeholder=""
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>

            <div class="flex flex-col">
              <label for="email" class="font-semibold">Emial *</label>
              <input
                type="text"
                id="email"
                name="email"
                required
                placeholder="exemple@gmail.com"
                class="border border-stone-900 rounded-full px-3 py-2 focus:outline-2 focus:outline-orange-600"
              />
            </div>
          </form>
        </div>
        <div class="p-6">right side</div>
      </section>
    </main>
  </body>
</html>
